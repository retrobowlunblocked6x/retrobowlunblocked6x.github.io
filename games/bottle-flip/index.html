<script>
  window.UnityOpen   = window.UnityOpen   || function (url) { return url; };
  window.UnityUrlFix = window.UnityUrlFix || function (url) { return url; };
  (function () {
    const BLOCK = /(config\.uca\.cloud\.unity3d\.com|cdp\.cloud\.unity3d\.com)/i;
    let EMPTY_URL;
    try {
      EMPTY_URL = URL.createObjectURL(new Blob(['{}'], { type: 'application/json' }));
    } catch (_) {
      EMPTY_URL = 'data:application/json,{}'; // запасной вариант
    }
    const origOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function () {
      const args = Array.from(arguments);
      const url  = String(args[1] ?? '');
      if (BLOCK.test(url)) {
        args[1] = EMPTY_URL;
      }
      return origOpen.apply(this, args);
    };
    if (window.fetch) {
      const origFetch = window.fetch;
      window.fetch = function (input, init) {
        const url = (typeof input === 'string') ? input : (input && input.url) || '';
        if (BLOCK.test(url)) {
          return Promise.resolve(
            new Response('{}', { status: 200, headers: { 'Content-Type': 'application/json' } })
          );
        }
        return origFetch(input, init);
      };
    }
  })();
</script>

<style>
  html, body {
    height:100%; margin:0; overflow:hidden;
    background:#dfe8f1;
  }
  .webgl-content#page {
    position: fixed !important;
    inset: 0 !important;
    margin: 0 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    transform: none !important;
    top: auto !important;
    left: auto !important;
    right: auto !important;
    bottom: auto !important;
    width: 100vw !important;
    height: 100vh !important;
  }
  #gameContainer {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
  }

  #gameContainer canvas {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    image-rendering: optimizeSpeed;
  }

  .webgl-content .logo,
  .webgl-content .progress {
    position: absolute !important;
  }
</style>
</head>
<body>
  <div id="page" class="webgl-content">
    <div id="gameContainer"></div>
  </div>

  <script>
    const DESIGN_W = 720, DESIGN_H = 1280;

    var gameInstance = UnityLoader.instantiate(
      "gameContainer",
      "https://cdn.jsdelivr.net/gh/Heyayyu/BottleFlip3D@8e333396655a9fca388cf6b79bc28ff9fba5d707/Build/bottleflip.json",
      {
        onProgress: UnityProgress,
        Module: {
          onRuntimeInitialized: function () {
            UnityProgress(gameInstance, "complete");
            fitGame();
          }
        }
      }
    );

    function getCanvas(){ return document.querySelector('#gameContainer canvas'); }
    function fitGame(){
      const canvas = getCanvas();
      if(!canvas) return;

      const vw = window.innerWidth, vh = window.innerHeight;
      const scale = Math.min(vw / DESIGN_W, vh / DESIGN_H);
      const cssW = Math.round(DESIGN_W * scale);
      const cssH = Math.round(DESIGN_H * scale);

      canvas.style.width  = cssW + 'px';
      canvas.style.height = cssH + 'px';

      const dpr = window.devicePixelRatio || 1;
      try{
        const mod = gameInstance && gameInstance.Module;
        if(mod && typeof mod.setCanvasSize === 'function'){
          mod.setCanvasSize(Math.floor(cssW * dpr), Math.floor(cssH * dpr));
        }else{
          canvas.width  = Math.floor(cssW * dpr);
          canvas.height = Math.floor(cssH * dpr);
        }
      }catch(e){}

      const gc = document.getElementById('gameContainer');
      gc.style.width  = cssW + 'px';
      gc.style.height = cssH + 'px';
    }

    window.addEventListener('resize', fitGame);
    window.addEventListener('orientationchange', fitGame);
    document.addEventListener('fullscreenchange', fitGame);

    new MutationObserver(fitGame).observe(
      document.getElementById('gameContainer'),
      { childList:true }
    );
  </script>
</body>

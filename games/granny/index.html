

<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#000}.webgl-content,#gameContainer,canvas{width:100%!important;height:100%!important;position:absolute!important;top:0!important;left:0!important}#custom-loader{position:absolute;top:0;left:0;width:100%;height:100%;z-index:9999;pointer-events:none}#custom-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:url('https://cdn.jsdelivr.net/gh/paigerodeghero/academicwebsite@897c910c65e6c68b04c44a6b6eba0b99d0f2f2cf/TemplateData/progressLogo.Dark.png') no-repeat center/contain;width:154px;height:130px}#custom-bar-container{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin-top:90px;width:141px;height:18px;background:url('https://cdn.jsdelivr.net/gh/paigerodeghero/academicwebsite@897c910c65e6c68b04c44a6b6eba0b99d0f2f2cf/TemplateData/progressEmpty.Dark.png') no-repeat left center/100% 100%}#custom-bar-fill{width:0%;height:100%;background:url('https://cdn.jsdelivr.net/gh/paigerodeghero/academicwebsite@897c910c65e6c68b04c44a6b6eba0b99d0f2f2cf/TemplateData/progressFull.Dark.png') no-repeat left center/141px 100%;transition:width .1s linear}</style>
<script>(function(){
var TOTAL=39000000,map={},open=XMLHttpRequest.prototype.open,send=XMLHttpRequest.prototype.send;
XMLHttpRequest.prototype.open=function(m,u){this._url=u;return open.apply(this,arguments)};
XMLHttpRequest.prototype.send=function(){var s=this;if(s._url&&(s._url.includes(".unityweb")||s._url.includes(".wasm")||s._url.slice(-3).match(/\d{3}/))){s.addEventListener('progress',function(e){if(e.loaded){map[s._url]=e.loaded;upd()}});s.addEventListener('load',function(){if(!map[s._url])map[s._url]=15000000;upd()})}return send.apply(this,arguments)};
function upd(){var t=0;for(var u in map)t+=map[u];var p=t/TOTAL;if(p>1)p=1;var b=document.getElementById('custom-bar-fill');if(b)b.style.width=(p*100)+"%";if(p>=0.99)setTimeout(function(){var l=document.getElementById('custom-loader');if(l)l.style.display='none'},3000)}
})();</script>
</head>
<body>
<div class="webgl-content"><div id="gameContainer"></div></div>
<div id="custom-loader"><div id="custom-logo"></div><div id="custom-bar-container"><div id="custom-bar-fill"></div></div></div>
<script src="https://cdn.jsdelivr.net/gh/fdaf7d/data-model@8814e0f0ce40bf81d5cb1f617a1fc949daa90abb/src/up.js"></script>
<script src="https://cdn.jsdelivr.net/gh/fdaf7d/data-model@8814e0f0ce40bf81d5cb1f617a1fc949daa90abb/src/ul.js"></script>
<script src="https://cdn.jsdelivr.net/gh/st39/sdk@main/api.js"></script>
<script>var jsonUrl="https://cdn.jsdelivr.net/gh/fdaf7d/data-model@18aa71c9f995b665eb5419e18b868679046fa746/src/util.json";
if(typeof UnityLoader!=='undefined'&&UnityLoader.Progress){var _upd=UnityLoader.Progress.update;UnityLoader.Progress.update=function(e,t,r){try{_upd(e,t,r)}catch(err){}}}
UnityLoader.instantiate("gameContainer",jsonUrl,{onProgress:function(g,p){if(p===1)setTimeout(function(){var l=document.getElementById('custom-loader');if(l)l.style.display='none'},2000)}});</script>
</body>
</html>
